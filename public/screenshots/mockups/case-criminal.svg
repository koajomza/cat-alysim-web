<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eaf2ff"/>
    </linearGradient>
    <linearGradient id="head" x1="0" x2="1">
      <stop offset="0" stop-color="#0f3570"/>
      <stop offset="1" stop-color="#2458ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#17335f" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="1180" height="760" rx="34" fill="url(#bg)"/>
  <rect x="46" y="46" width="1088" height="668" rx="28" fill="#fff" filter="url(#shadow)"/>
  <rect x="46" y="46" width="1088" height="148" rx="28" fill="url(#head)"/>
  <text x="86" y="98" font-family="Segoe UI, Tahoma, sans-serif" font-size="22" font-weight="800" fill="#bcd3ff">CRIMINAL CASE MOCKUP</text>
  <text x="86" y="144" font-family="Segoe UI, Tahoma, sans-serif" font-size="38" font-weight="900" fill="#fff">คดีอาญา · ลักทรัพย์ในเวลากลางคืน</text>
  <rect x="884" y="80" width="190" height="58" rx="20" fill="#ffffff" opacity=".95"/>
  <text x="922" y="116" font-family="Segoe UI, Tahoma, sans-serif" font-size="22" font-weight="900" fill="#2458ff">C14/2569</text>
  <text x="86" y="244" font-family="Segoe UI, Tahoma, sans-serif" font-size="20" font-weight="900" fill="#0c1f39">ผู้กล่าวหา</text>
  <text x="86" y="286" font-family="Segoe UI, Tahoma, sans-serif" font-size="28" font-weight="800" fill="#10284a">น.ส.วิลาสินี ชุมแสง</text>
  <text x="86" y="330" font-family="Segoe UI, Tahoma, sans-serif" font-size="18" fill="#61718a">ร้านสะดวกซื้อริมถนนราชพฤกษ์ · แจ้งทรัพย์สินหายหลังปิดร้าน</text>
  <text x="590" y="244" font-family="Segoe UI, Tahoma, sans-serif" font-size="20" font-weight="900" fill="#0c1f39">ผู้ต้องหา</text>
  <text x="590" y="286" font-family="Segoe UI, Tahoma, sans-serif" font-size="28" font-weight="800" fill="#10284a">นายกิตติพงศ์ เมืองใจ</text>
  <text x="590" y="330" font-family="Segoe UI, Tahoma, sans-serif" font-size="18" fill="#61718a">รับสารภาพบางส่วน · รอตรวจกล้องวงจรปิดเพิ่มเติม</text>
  <rect x="86" y="390" width="1008" height="1" fill="#dce5f2"/>
  <g font-family="Segoe UI, Tahoma, sans-serif">
    <rect x="86" y="438" width="274" height="92" rx="18" fill="#eef5ff" stroke="#c9daf5"/>
    <text x="112" y="474" font-size="16" font-weight="800" fill="#64748b">สถานะ</text>
    <text x="112" y="508" font-size="24" font-weight="900" fill="#c05621">อยู่ระหว่างสอบสวน</text>
    <rect x="396" y="438" width="274" height="92" rx="18" fill="#f3fff6" stroke="#bee8ca"/>
    <text x="422" y="474" font-size="16" font-weight="800" fill="#64748b">ของกลาง</text>
    <text x="422" y="508" font-size="24" font-weight="900" fill="#16845b">โทรศัพท์ 1 เครื่อง</text>
    <rect x="706" y="438" width="274" height="92" rx="18" fill="#fff8eb" stroke="#f0d49b"/>
    <text x="732" y="474" font-size="16" font-weight="800" fill="#64748b">กำหนด</text>
    <text x="732" y="508" font-size="24" font-weight="900" fill="#9a5b00">ฝากขังครั้งที่ 1</text>
  </g>
  <rect x="86" y="582" width="1008" height="74" rx="18" fill="#f8fafc" stroke="#dce5f2"/>
  <text x="112" y="626" font-family="Segoe UI, Tahoma, sans-serif" font-size="20" font-weight="800" fill="#30435f">บันทึกสั้น: ระบบช่วยดึงชื่อคู่คดี ข้อหา สถานที่ และของกลางไปสร้างเอกสาร Word ได้ทันที</text>
  <text x="86" y="692" font-family="Segoe UI, Tahoma, sans-serif" font-size="15" font-weight="800" fill="#8a98ad">ข้อมูลจำลองเพื่อสาธิตหน้าจอ ไม่ใช่ข้อมูลบุคคลจริง</text>
</svg>
